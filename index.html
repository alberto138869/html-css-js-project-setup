<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Relógio digital moderno em HTML, CSS e JavaScript puro."
    />
    <title>Relógio Digital</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="clock-screen">
      <section class="clock-card" aria-label="Relógio digital">
        <p class="eyebrow">Hora local</p>

        <div class="time" aria-live="polite" aria-atomic="true">
          <span id="hours">00</span>
          <span class="separator">:</span>
          <span id="minutes">00</span>
          <span class="separator">:</span>
          <span id="seconds">00</span>
        </div>

        <div class="meta-row">
          <span id="dateText">Segunda, 11 de agosto de 2026</span>
          <span id="ampm" class="ampm">AM</span>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
